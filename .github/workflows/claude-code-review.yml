name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            Do these two steps, in order, every time — step 2 is REQUIRED
            regardless of what step 1 finds, do not skip it:

            1. Run `/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}`.

            2. Check whether step 1 posted any inline comments. If it posted
               zero inline comments (no findings), you MUST run:
               `gh pr comment ${{ github.event.pull_request.number }} --body "Looks good to me — no issues found."`
               This step is mandatory whenever step 1 found nothing — it is
               not optional and not implied by step 1 alone. Every run of
               this workflow must leave at least one comment on the PR,
               either inline findings from step 1 or the fallback from
               step 2.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

