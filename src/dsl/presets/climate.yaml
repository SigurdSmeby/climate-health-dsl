# A two-driver climate scenario with a counted disease: the shape most
# scenarios start from. Use it with `preset: climate` and write only what
# differs.
#
# It is an ordinary scenario file — `dsl run` it directly to see what it
# produces, and copy it as a starting point if you would rather not use a
# preset at all.
period: monthly
n_total: 60
seed: 42

locations:
  north: { population: 300000 }
  south: { population: 180000 }

series:
  # Rainfall with a wet season: the spike is what the disease lags behind.
  - name: rainfall
    generate: seasonal_spike
    unit: mm
    params:
      spike_height: 30
      clamp_min: 0

  # Temperature as a smooth annual cycle, a second driver on a shorter lag.
  - name: temperature
    generate: seasonal_smooth
    unit: C
    params:
      mean: 25
      amplitude: 6

  # The planted relationship: rainfall two months back dominates,
  # temperature one month back contributes less.
  - name: disease_cases
    counts: {}
    depends_on:
      - { series: rainfall, lag: 2, weight: 1.0 }
      - { series: temperature, lag: 1, weight: 0.4 }
