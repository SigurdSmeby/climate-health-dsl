[project]
name = "dsl"
version = "1.7.0"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sigurd Smeby", email = "sigurd.smeby@proton.me" }]
dependencies = ["pydantic>=2", "pyyaml", "numpy", "pandas", "plotly", "kaleido"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
dsl = "dsl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
