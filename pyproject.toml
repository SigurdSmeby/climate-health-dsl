[project]
name = "dsl"
version = "1.6.2"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "numpy", "pandas", "plotly", "kaleido"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
dsl = "dsl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
