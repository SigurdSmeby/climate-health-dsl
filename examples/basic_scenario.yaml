period: weekly
n_total: 78
seed: 42
train_fraction: 0.8 # OPTIONAL — omit to write only the single full CSV
series:
  - name: rainfall
    generate: seasonal_spike
  - name: mean_temperature # CHAP's column name (not "temperature")
    generate: seasonal_smooth
  # A `counts:` block makes this a disease signal: its float values become
  # whole case counts, drawn against the population.
  - name: disease_cases
    counts:
      population: 100000 # constant population; scales the incidence model
    depends_on:
      - series: rainfall
        lag: 3
        weight: 1.0
      - series: mean_temperature
        lag: 3
        weight: 1.0
