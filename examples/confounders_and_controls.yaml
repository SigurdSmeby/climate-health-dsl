# Demonstrates control / decoy / confounder series and an autoregressive
# disease signal — the kind of scenario that tests whether a model finds the
# REAL driver and isn't fooled by irrelevant ones.
#
# Ground truth: disease depends ONLY on rainfall (lag 4). The other three
# series are present in the data but the disease does NOT use them:
#   - humidity     : a flat, non-seasonal decoy (no signal at all)
#   - access_index : a steady upward trend (a confounder — e.g. improving
#                    reporting or urbanization that drifts over time)
#   - mean_temperature : a real-looking seasonal series that is still a
#                    decoy here (seasonal, but disease ignores it)
# A good forecasting model should recover the rainfall->disease lag and give
# little weight to the three decoys.
#
# The `autoregressive:` block gives the disease memory of its own past, on top
# of the climate drivers: phi is the fraction of each period carried into the
# next, so it is itself a ground truth a model can be scored on recovering.
period: weekly
n_total: 156
seed: 7
train_fraction: 0.8
locations:
  loc:
    population: 40000
series:
- name: rainfall
  generate: seasonal_spike
  params:
    clamp_min: 0
- name: mean_temperature
  generate: seasonal_smooth
- name: humidity
  generate: flat
  params:
    level: 70
    noise: 5
    clamp_min: 0
- name: access_index
  generate: linear_trend
  params:
    start: 50
    slope: 0.2
    noise: 1
- name: disease_cases
  depends_on:
  - series: rainfall
    lag: 4
    weight: 2.0
  autoregressive:
    phi: 0.8
    noise: 0.2
  missing_rate: 0
  counts: {}
