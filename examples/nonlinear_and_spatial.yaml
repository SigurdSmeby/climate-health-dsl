# Showcases the nonlinear / distributed-lag / spatial / extreme-event features.
# A regional monsoon burst strikes both provinces in the SAME periods, rainfall
# feeds a soil-moisture store that drains over time, the store affects disease
# only above a threshold and across a spread of lags, and an outbreak-shock
# series injects rare heatwaves.
#
#   uv run dsl run examples/nonlinear_and_spatial.yaml --plot
#   uv run dsl run examples/nonlinear_and_spatial.yaml -o out/study --replicates 10
period: weekly
n_total: 156
seed: 7
train_fraction: 0.8

locations:
  north: { population: 300000 }
  south: { population: 180000 }

# A named event couples series that no generator could couple: the burst hits
# every location in the same periods, which is what makes the two provinces
# move together, and it raises rainfall while cooling the air at once.
events:
  monsoon_burst: { rate: 0.04 }

series:
  - name: rainfall
    generate: seasonal_spike
    params: { spike_height: 30, clamp_min: 0 }
    events:
      monsoon_burst: { multiplier: 2.0 } # up, proportionally

  - name: heatwaves
    generate: outbreak_shocks
    params: { baseline: 20, rate: 2.0, magnitude: 8, duration: 2 }
    events:
      monsoon_burst: { add: -3.0 } # down, by a fixed amount

  # A series built from other series: rain fills it, heat drains it, and its
  # own persistence carries moisture from one week into the next. With no
  # `generate:` its base is flat, so its parents give it all of its shape.
  - name: soil_moisture
    autoregressive: { phi: 0.85, noise: 0.3 }
    depends_on:
      - { series: rainfall, lag: 1, weight: 1.0 }
      - { series: heatwaves, lag: 1, weight: -0.4 }

  - name: disease_cases
    counts:
      median_rate: 0.1
      max_rate: 0.4
      distribution: negative_binomial # overdispersed, spikier counts
      overdispersion: 8.0
    depends_on:
      # Disease responds to the moisture store, not to rainfall directly, and
      # only above a threshold (nonlinear) spread over the following weeks.
      - series: soil_moisture
        weight: 3.0
        transforms:
          - { name: threshold, params: { mode: hinge, threshold: 0.5 } }
          - { name: distributed_lag, params: { weights: [0.4, 0.3, 0.2, 0.1] } }
      - { series: heatwaves, lag: 1, weight: 1.5 }
