# Fully synthetic scenario tuned to LOOK like examples/data/laos_subset.csv:
# monthly data for three Lao provinces with a July monsoon rainfall spike,
# a smooth temperature wave peaking in April, and dengue-scale case counts.
# No real data is used — this is the basic scenario's generators with
# parameters matched to the real dataset's statistics.
period: monthly
n_total: 36
seed: 42
start_period: "2010-01" # same calendar window as the real dataset
locations:
  - Bokeo
  - Savannakhet
  - Vientiane[prefecture]
variables:
  - name: rainfall
    generate: seasonal_spike
    params:
      baseline: 30 # dry-season level, mm
      spike_height: 450 # monsoon peak above the baseline
      spike_center: 6 # July (month index 6 within the year)
      spike_width: 1.5 # months; covers the ~Jun-Sep wet season
      noise: 25
      clamp_min: 0 # rainfall can never be negative
  - name: mean_temperature
    generate: seasonal_smooth
    params:
      mean: 23.5 # deg C; phase 0 peaks at April in monthly data
      amplitude: 4
      phase: 0
      noise: 0.7
disease_cases:
  population: 75000
  depends_on:
    - variable: rainfall
      lag: 2
      weight: 1.5
    - variable: mean_temperature
      lag: 1
      weight: 1.0
  autoregressive: false
  missing_rate: 0
  # Real Laos incidence is tiny (~1e-4); the defaults would give thousands
  # of monthly cases.
  max_rate: 0.002
  median_rate: 0.0001
