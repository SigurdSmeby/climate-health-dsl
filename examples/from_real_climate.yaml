# Semi-synthetic: REAL climate, synthetic disease.
#
# Rainfall and temperature are read from a real CSV; the disease is generated
# from them with a lag you chose. So the climate is as messy as the world is,
# while the relationship being recovered is still exactly known.
#
#   dsl run examples/from_real_climate.yaml --plot
#
# The CSV holds three Lao provinces. Naming the locations after the CSV's own
# provinces lets each one read its own rows — no source_location needed.

period: monthly
n_total: 36
seed: 7
start_period: 2010-01 # align the labels with the source data

locations:
  Bokeo: { population: 206000 }
  Vientiane[prefecture]: { population: 948000 }
  Savannakhet: { population: 970000 }

series:
  - name: rainfall
    generate: from_csv
    params: { file: examples/data/laos_subset.csv, column: rainfall }

  - name: mean_temperature
    generate: from_csv
    params: { file: examples/data/laos_subset.csv, column: mean_temperature }

  - name: disease_cases
    counts:
      distribution: negative_binomial # overdispersed, like real surveillance
      overdispersion: 5.0
    depends_on:
      - { series: rainfall, lag: 2, weight: 1.5 }
      - { series: mean_temperature, lag: 1, weight: 1.0 }
