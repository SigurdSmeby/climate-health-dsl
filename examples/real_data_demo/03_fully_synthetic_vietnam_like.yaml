# DEMO 3 — Fully synthetic dataset tuned to RESEMBLE the Vietnam data.
#
# No real data is read. The climate is generated by seasonal_spike /
# seasonal_smooth with parameters matched to the real Vietnam provinces
# (monsoon rainfall ~0-500 mm, temperature ~24-31 C), and disease is driven
# by them with the same known lags as Demo 1. This is the counterpart to the
# semi-synthetic demos: it shows the tool can fabricate convincing weather
# from scratch when no real source is available, with the relationships still
# fully controlled. Includes a decoy covariate the disease ignores.
#
# Shows: synthetic generators tuned to real statistics, multi-location with
# independent draws per location, a control/decoy variable, missing data.
period: monthly
n_total: 120
seed: 42
start_period: "2000-01"
locations: [delta, highland, coast]
variables:
  - name: rainfall
    generate: seasonal_spike
    params:
      baseline: 30
      spike_height: 450
      spike_center: 6 # mid-year monsoon
      spike_width: 1.8
      noise: 40
      clamp_min: 0
  - name: mean_temperature
    generate: seasonal_smooth
    params:
      mean: 27
      amplitude: 3.5
      phase: 0
      noise: 0.8
  - name: humidity # DECOY: present in the data but disease does not depend on it
    generate: flat
    params: { level: 80, noise: 4, clamp_min: 0 }
disease_cases:
  population: 1500000
  depends_on:
    - { variable: rainfall, lag: 2, weight: 1.5 }
    - { variable: mean_temperature, lag: 1, weight: 1.0 }
  count_distribution: negative_binomial
  overdispersion: 3.0
  missing_rate: 0.03 # a few reporting gaps
  max_rate: 0.02
  median_rate: 0.001
