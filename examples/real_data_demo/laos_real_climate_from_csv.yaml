# REAL CLIMATE, SYNTHETIC DISEASE: rainfall and temperature are read with the
# from_csv generator from the bundled CHAP Laos subset (Bokeo province,
# 2010-2012); only disease_cases is generated, with a controlled lag/weight
# relationship on top of the real weather.
#
# Compare with laos_fully_synthetic.yaml, which generates everything (no real
# data) but is tuned to resemble this dataset.
period: monthly
n_total: 36
seed: 42
start_period: "2010-01" # align output labels with the source data's dates
variables:
  - name: rainfall
    generate: from_csv
    params:
      file: ../data/laos_subset.csv
      column: rainfall
      source_location: Bokeo
  - name: mean_temperature
    generate: from_csv
    params:
      file: ../data/laos_subset.csv
      column: mean_temperature
      source_location: Bokeo
disease_cases:
  population: 75000
  depends_on:
    - variable: rainfall
      lag: 2
      weight: 1.5
    - variable: mean_temperature
      lag: 1
      weight: 1.0
  autoregressive: false
  missing_rate: 0
  # Real dengue counts are overdispersed, not tidy Poisson.
  count_distribution: negative_binomial
  overdispersion: 3.0
