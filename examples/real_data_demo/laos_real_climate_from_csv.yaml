# REAL CLIMATE, SYNTHETIC DISEASE: rainfall and temperature are read with the
# from_csv generator from the bundled Laos subset (Bokeo province,
# 2010-2012); only disease_cases is generated, with a controlled lag/weight
# relationship on top of the real weather.
#
# Compare with laos_fully_synthetic.yaml, which generates everything (no real
# data) but is tuned to resemble this dataset.
period: monthly
n_total: 36
seed: 42
start_period: 2010-01
locations:
  loc:
    population: 75000
series:
- name: rainfall
  generate: from_csv
  params:
    file: ../data/laos_subset.csv
    column: rainfall
    source_location: Bokeo
- name: mean_temperature
  generate: from_csv
  params:
    file: ../data/laos_subset.csv
    column: mean_temperature
    source_location: Bokeo
- name: disease_cases
  depends_on:
  - series: rainfall
    lag: 2
    weight: 1.5
  - series: mean_temperature
    lag: 1
    weight: 1.0
  missing_rate: 0
  counts:
    distribution: negative_binomial
    overdispersion: 3.0
