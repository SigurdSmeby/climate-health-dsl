# log and power are reachable from YAML, so one case proves the whole path:
# registry -> _build_transform -> apply, with a reproduce check.
_expect:
  exit_code: 0
  files_exist:
  - simulated_data.csv
  - metadata.json
  reproduce: true
period: monthly
n_total: 60
seed: 0
series:
- name: rainfall
  generate: seasonal_spike
  unit: mm
- name: disease_cases
  depends_on:
  - series: rainfall
    lag: 2
    weight: 1.5
    transforms:
    - name: log
      params:
        shift: 1.0
    - name: power
      params:
        exponent: 0.5
  counts: {}
locations:
  loc:
    population: 300000
