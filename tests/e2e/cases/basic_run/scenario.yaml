_expect:
  exit_code: 0
  files_exist:
  - simulated_data.csv
  - metadata.json
  reproduce: true
period: monthly
n_total: 36
seed: 42
series:
- name: rainfall
  generate: seasonal_spike
- name: mean_temperature
  generate: seasonal_smooth
- name: disease_cases
  depends_on:
  - series: rainfall
    lag: 3
    weight: 1.0
  - series: mean_temperature
    lag: 3
    weight: 1.0
  counts:
    population: 100000
