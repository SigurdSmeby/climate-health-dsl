# An expanding time split: each fold trains on everything before its test
# block, so a model is never shown the future it is asked to forecast.
_expect:
  exit_code: 0
  files_exist:
    - simulated_data.csv
    - metadata.json
    - folds/fold_0/train.csv
    - folds/fold_0/test.csv
    - folds/fold_4/train.csv
    - folds/fold_4/test.csv
  files_absent: [train.csv, test.csv]
  reproduce: true

period: monthly
n_total: 60
seed: 42

split:
  kind: time
  k: 5

locations:
  loc:
    population: 100000

series:
  - name: rainfall
    generate: seasonal_spike
  - name: disease_cases
    counts: {}
    depends_on:
      - series: rainfall
        lag: 1
        weight: 1.0
