# A swept scenario: one value list, one from/to range, so a single
# `dsl run` writes 2 x 2 = 4 run directories.
_expect:
  exit_code: 0
  files_exist:
  - spike_height_10__lag_1/simulated_data.csv
  - spike_height_10__lag_1/metadata.json
  - spike_height_10__lag_2/simulated_data.csv
  - spike_height_40__lag_1/simulated_data.csv
  - spike_height_40__lag_2/metadata.json
  files_absent:
  # Nothing is written at the root of a swept run: each combination is its
  # own dataset, and a CSV here would not say which one it came from.
  - simulated_data.csv
  - metadata.json
period: monthly
n_total: 24
seed: 42
locations:
  loc:
    population: 100000
series:
- name: rainfall
  generate: seasonal_spike
  params:
    spike_height:
      sweep: [10, 40]
- name: disease_cases
  counts: {}
  depends_on:
  - series: rainfall
    lag:
      sweep: {from: 1, to: 2}
    weight: 1.0
