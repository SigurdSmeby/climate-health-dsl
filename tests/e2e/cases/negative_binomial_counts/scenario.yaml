_expect:
  exit_code: 0
  files_exist:
  - simulated_data.csv
  column_all:
    disease_cases: non_negative_int
period: monthly
n_total: 36
seed: 5
series:
- name: rainfall
  generate: seasonal_spike
- name: disease_cases
  depends_on:
  - series: rainfall
    lag: 1
    weight: 1.0
  counts:
    population: 100000
    distribution: negative_binomial
    overdispersion: 2.0
