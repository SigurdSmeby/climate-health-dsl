# Two diseases in one run, and one drives the other: malaria responds to dengue
# with a lag, which a single disease_cases block could not express.
_expect:
  exit_code: 0
  files_exist: [simulated_data.csv, metadata.json]
  column_exists: [dengue, malaria]
  column_all:
    dengue: non_negative_int
    malaria: non_negative_int
  reproduce: true

period: monthly
n_total: 48
seed: 7

series:
  - name: rainfall
    generate: seasonal_spike
  - name: dengue
    counts: {population: 100000, distribution: negative_binomial}
    depends_on:
      - {series: rainfall, lag: 1, weight: 1.5}
  - name: malaria
    counts: {population: 100000}
    depends_on:
      - {series: dengue, lag: 2, weight: 1.0}
