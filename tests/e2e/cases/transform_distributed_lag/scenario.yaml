_expect:
  exit_code: 0
  files_exist: [simulated_data.csv, metadata.json]
  reproduce: true

period: weekly
n_total: 104
seed: 0
variables:
  - {name: rainfall, generate: seasonal_spike}
disease_cases:
  population: 300000
  depends_on:
    - variable: rainfall
      weight: 1.0
      transforms:
        - {name: distributed_lag, params: {weights: [0.5, 0.3, 0.2]}}
