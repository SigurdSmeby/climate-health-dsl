# Leave-location-out: each fold holds one province out entirely, testing
# whether a model generalises to a place it never saw.
_expect:
  exit_code: 0
  files_exist:
    - simulated_data.csv
    - folds/fold_0/train.csv
    - folds/fold_0/test.csv
    - folds/fold_2/train.csv
    - folds/fold_2/test.csv
  reproduce: true

period: monthly
n_total: 36
seed: 1

split:
  kind: location

locations:
  north: { population: 300000 }
  south: { population: 180000 }
  east: { population: 240000 }

series:
  - name: rainfall
    generate: seasonal_spike
  - name: disease_cases
    counts: {}
    depends_on:
      - series: rainfall
        lag: 1
        weight: 1.5
