_expect:
  exit_code: 0
  files_exist:
  - simulated_data.csv
  - metadata.json
  column_exists:
  - rainfall
  - temperature
  - soil_moisture
  - disease_cases
  column_all:
    disease_cases: non_negative_int
  reproduce: true
period: monthly
n_total: 60
seed: 1
series:
- name: rainfall
  generate: seasonal_spike
  params:
    spike_height: 30
    clamp_min: 0
- name: temperature
  generate: seasonal_smooth
  params:
    mean: 25
    amplitude: 6
- name: soil_moisture
  autoregressive:
    phi: 0.85
    noise: 0.3
  depends_on:
  - series: rainfall
    lag: 1
    weight: 1.0
  - series: temperature
    lag: 1
    weight: -0.4
- name: disease_cases
  counts: {}
  depends_on:
  - series: soil_moisture
    lag: 2
    weight: 2.0
locations:
  loc:
    population: 100000
