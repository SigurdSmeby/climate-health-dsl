# A chain of series: rain fills a soil-moisture store, heat drains it, and the
# disease responds to the store rather than to rainfall directly. The store is
# a real column, so the intermediate step is inspectable.
_expect:
  exit_code: 0
  files_exist: [simulated_data.csv, metadata.json]
  column_exists: [rainfall, temperature, soil_moisture, disease_cases]
  column_all:
    disease_cases: non_negative_int
  reproduce: true

period: monthly
n_total: 60
seed: 1

series:
  - name: rainfall
    generate: seasonal_spike
    params: {spike_height: 30, clamp_min: 0}
  - name: temperature
    generate: seasonal_smooth
    params: {mean: 25, amplitude: 6}
  - name: soil_moisture
    autoregressive: {phi: 0.85, noise: 0.3}
    depends_on:
      - {series: rainfall, lag: 1, weight: 1.0}
      - {series: temperature, lag: 1, weight: -0.4}
  - name: disease_cases
    counts: {population: 100000}
    depends_on:
      - {series: soil_moisture, lag: 2, weight: 2.0}
