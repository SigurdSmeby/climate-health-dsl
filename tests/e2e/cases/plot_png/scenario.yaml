_run:
  extra_args: ["--plot", "--plot-format", "png"]
_expect:
  exit_code: 0
  files_exist: [simulated_data.csv, plot.png]

period: weekly
n_total: 78
seed: 1
variables:
  - name: rainfall
    generate: seasonal_spike
disease_cases:
  population: 100000
  depends_on: [{variable: rainfall, lag: 1, weight: 1.0}]
